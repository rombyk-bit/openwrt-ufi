name: Build-UFI103S-Perfect

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Включить SSH для ручного menuconfig?'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lkiuyu/openwrt-ufi
          ref: main

      - name: Max Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f

      - name: Install Tools & Update CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses5-dev libssl-dev python3-distutils python3-pip rsync unzip zlib1g-dev \
          file wget subversion patch swig libpython3-dev qemu-utils tmate python3-pip
          
          # Установка последней версии CMake через Python пакетный менеджер
          pip3 install --user cmake
          
          # Добавляем путь к новому cmake в системный PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          

      - name: Verify CMake
        run: cmake --version
        
      - name: Hard Patch CMake
        run: |
          # Этот блок принудительно правит все конфиги, даже если они перекачались
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find ./feeds/ -name CMakeLists.txt -exec sed -i 's/3.31/3.29/g' {} +
          find ./feeds/ -name CMakeLists.txt -exec sed -i 's/3.30/3.29/g' {} +
          # Проверяем, что патч применился к проблемному пакету
          grep "cmake_minimum_required" feeds/luci/libs/rpcd-mod-luci/CMakeLists.txt || echo "File not found yet"
          

      - name: Feeds & SSH
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: SSH Debug (Tmate)
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/ssh2actions@main

      - name: UFI103S Config
        run: |
          # Стираем чужие конфиги
          rm -f .config
          # Цель: MSM8916 для UFI103S
          echo 'CONFIG_TARGET_msm89xx=y' > .config
          echo 'CONFIG_TARGET_msm89xx_msm8916=y' >> .config
          echo 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_uand_ufi103s=y' >> .config
          
          # Обязательные пакеты для донгла
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-ru=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-net-rndis=y' >> .config
          echo 'CONFIG_PACKAGE_uqmi=y' >> .config
          
          make defconfig

      - name: Download & Build
        run: |
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: UFI103S-Firmware-Final
          path: bin/targets/msm89xx/msm8916/
          
