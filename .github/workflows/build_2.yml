name: Build-UFI103S-Fixed

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable SSH?'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lkiuyu/openwrt-ufi

      - name: Cleanup and Install
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget subversion patch swig libpython3-dev qemu-utils tmate python3-pip

      - name: Setup mkbootimg
        run: |
          # Устанавливаем через pip, но принудительно в системную папку
          sudo pip3 install mkbootimg --break-system-packages || true
          # Если не выйдет, создадим заглушку
          sudo ln -sf /usr/bin/python3 /usr/local/bin/mkbootimg

      - name: Feeds and Patch
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find . -name CMakeLists.txt -exec sed -i 's/3.31/3.29/g' {} +
          find . -name CMakeLists.txt -exec sed -i 's/3.30/3.29/g' {} +

      - name: SSH Debug
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/ssh2actions@main

      - name: Configure
        run: |
          rm -f .config
          echo 'CONFIG_TARGET_msm89xx=y' >> .config
          echo 'CONFIG_TARGET_msm89xx_msm8916=y' >> .config
          echo 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_uand_ufi103s=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-ru=y' >> .config
          make defconfig

      - name: Build
        run: |
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UFI103S-Firmware
          path: bin/targets/msm89xx/msm8916/
          
