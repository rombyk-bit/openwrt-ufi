name: Build-UFI103S-Final-V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lkiuyu/openwrt-ufi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget subversion patch swig libpython3-dev qemu-utils python3

      - name: Feeds & Patch
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Исправляем CMake для всех пакетов
          find . -name CMakeLists.txt -exec sed -i 's/3.31/3.29/g' {} +
          find . -name CMakeLists.txt -exec sed -i 's/3.30/3.29/g' {} +

      - name: Setup mkbootimg (Internal Way)
        run: |
          # Создаем папку хост-инструментов, которую OpenWrt использует ВСЕГДА
          mkdir -p staging_dir/host/bin
          
          # Записываем скрипт
          cat << 'EOF' > staging_dir/host/bin/mkbootimg
          #!/usr/bin/env python3
          import sys, struct, argparse
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('--kernel', type=argparse.FileType('rb'), required=True)
              parser.add_argument('--ramdisk', type=argparse.FileType('rb'))
              parser.add_argument('--cmdline', default='', type=str)
              parser.add_argument('-o', '--output', type=argparse.FileType('wb'), required=True)
              parser.add_argument('--base', type=str, default='0x80000000')
              parser.add_argument('--pagesize', type=int, default=2048)
              args, unknown = parser.parse_known_args()
              k = args.kernel.read()
              r = args.ramdisk.read() if args.ramdisk else b''
              base = int(args.base, 16)
              ps = args.pagesize
              hdr = struct.pack('8s10I16s512s1024s', b'ANDROID!', len(k), base+0x8000, len(r), base+0x01000000, 0, base+0x100, 0, ps, 0, 0, b'', args.cmdline.encode(), b'')
              args.output.write(hdr + b'\x00'*(ps-(len(hdr)%ps)) + k + b'\x00'*(ps-(len(k)%ps) or ps))
              if r: args.output.write(r + b'\x00'*(ps-(len(r)%ps) or ps))
          if __name__ == '__main__': main()
          EOF
          
          chmod +x staging_dir/host/bin/mkbootimg
          cp staging_dir/host/bin/mkbootimg staging_dir/host/bin/mkbootimg.py
          
          # Мы НЕ добавляем ничего в GITHUB_PATH, чтобы не сломать системные ссылки на bash/perl

      - name: Configure
        run: |
          [ -e .config ] && rm .config
          echo 'CONFIG_TARGET_msm89xx=y' >> .config
          echo 'CONFIG_TARGET_msm89xx_msm8916=y' >> .config
          echo 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_uand_ufi103s=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-ru=y' >> .config
          # Принудительно отключаем проблемные пакеты из прошлых логов
          echo 'CONFIG_PACKAGE_tcsh=n' >> .config
          echo 'CONFIG_PACKAGE_xupnpd=n' >> .config
          make defconfig

      - name: Build
        run: |
          # Собираем с FORCE=1, чтобы игнорировать проверку prereq, которая ломается из-за ссылок
          make -j$(nproc) FORCE=1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UFI103S-Firmware
          path: bin/targets/msm89xx/msm8916/
          
