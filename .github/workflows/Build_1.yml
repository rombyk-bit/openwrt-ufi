name: Build-UFI103S-Complete

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Включить SSH для ручной настройки?'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lkiuyu/openwrt-ufi

      - name: Space Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget subversion patch swig libpython3-dev qemu-utils tmate

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch CMake Requirement
        run: |
          # Понижаем требования CMake с 3.31 до 3.29, чтобы не было ошибки в rpcd-mod-luci
          find . -name CMakeLists.txt -exec sed -i 's/3.31/3.29/g' {} +
          find . -name CMakeLists.txt -exec sed -i 's/3.30/3.29/g' {} +
          echo "CMake requirement patched to 3.29"

      - name: SSH Debug (Optional)
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/ssh2actions@main

      - name: Configure Firmware
        run: |
          rm -f .config
          # Цель: Qualcomm MSM8916 -> UFI103S
          echo 'CONFIG_TARGET_msm89xx=y' > .config
          echo 'CONFIG_TARGET_msm89xx_msm8916=y' >> .config
          echo 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_uand_ufi103s=y' >> .config
          
          # Интерфейс и локализация
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-ru=y' >> .config
          
          # Модемные драйверы (RNDIS, QMI)
          echo 'CONFIG_PACKAGE_kmod-usb-net-rndis=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-serial-option=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y' >> .config
          echo 'CONFIG_PACKAGE_uqmi=y' >> .config
          echo 'CONFIG_PACKAGE_usbutils=y' >> .config

          make defconfig

      - name: Download & Build
        run: |
          make download -j$(nproc)
          # Сборка. Если упадет — покажет подробный лог (V=s)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: UFI103S-OpenWrt-Binaries
          path: bin/targets/msm89xx/msm8916/
          
